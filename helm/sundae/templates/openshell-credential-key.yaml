{{- /*
The embedded OpenShell gateway's credential key-encryption key, generated in
the cluster by a pre-install/pre-upgrade hook Job (an Argo CD PreSync hook)
instead of at render time: the OpenShell chart's own generator depends on
`lookup`, which helm template and Argo CD cannot run, so every render would
replace the key and make the stored credentials unreadable. The Job creates
the Secret openshell.server.credentialStorage.existingSecret once and never
changes it. The Secret is not part of the release: uninstalling or pruning
leaves it in place.
*/ -}}
{{- $os := .Values.openshell | default dict -}}
{{- $server := $os.server | default dict -}}
{{- $secretName := dig "credentialStorage" "existingSecret" "" $server -}}
{{- $drivers := $server.credentialDrivers | default dict -}}
{{- $driverOn := or (dig "kubernetesSecrets" "enabled" false $drivers) (dig "vault" "enabled" false $drivers) -}}
{{- if and (include "sundae.openshellEmbedded" .) (dig "credentialKey" "generate" false $os) (not $driverOn) }}
{{- if not $secretName }}
{{- fail "openshell.credentialKey.generate needs openshell.server.credentialStorage.existingSecret: the name of the Secret to generate (or set generate: false to let the OpenShell chart generate it with lookup)" }}
{{- end }}
{{- $hookName := printf "%s-openshell-credential-key" (include "sundae.fullname" .) | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sundae.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-50"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sundae.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-50"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  # create cannot be limited to a name; get can.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sundae.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-50"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $hookName }}
subjects:
  - kind: ServiceAccount
    name: {{ $hookName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sundae.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "sundae.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: openshell-credential-key
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $hookName }}
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: credential-key
          image: {{ include "sundae.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/usr/local/bin/sundae"]
          args:
            - kube
            - ensure-secret
            - --name={{ $secretName }}
            - --key=key-encryption-key
            - --bytes=32
            - --label=app.kubernetes.io/name={{ include "sundae.name" . }}
            - --label=app.kubernetes.io/instance={{ .Release.Name }}
            - --label=app.kubernetes.io/component=openshell-credential-key
            - --annotation=sundae/note=OpenShell credential key-encryption key; never change or delete it (stored credentials are encrypted with it)
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
{{- end }}
