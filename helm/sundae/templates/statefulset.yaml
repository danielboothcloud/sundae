{{- $cfg := .Values.config }}
{{- $fullname := include "sundae.fullname" . }}
{{- $openshellTLS := include "sundae.openshellTLSMounted" . }}
{{- $openshellToken := include "sundae.openshellTokenMounted" . }}
{{- $ntfyToken := include "sundae.ntfyTokenMounted" . }}
{{- $s3Creds := include "sundae.s3CredentialsMounted" . }}
{{- $httpScheme := ternary "HTTPS" "HTTP" (and (not (empty $cfg.http.tls_key_path)) (not (empty $cfg.http.tls_cert_path))) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "sundae.labels" . | nindent 4 }}
spec:
  # Always one. SQLite and the bare repositories live on a single
  # ReadWriteOnce volume. A StatefulSet only creates the replacement pod once
  # the old one is gone, so two pods never have the volume at the same time
  # (a Deployment can overlap them, even with the Recreate strategy, when a
  # pod is deleted by hand).
  replicas: 1
  serviceName: {{ $fullname }}-http
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "sundae.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Sundae reads its config once at startup: roll the pod on change.
        checksum/config: {{ include "sundae.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "sundae.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "sundae.serviceAccountName" . }}
      automountServiceAccountToken: false
      # Service links would inject SUNDAE_SSH_PORT, SUNDAE_HTTP_PORT, ...
      # for this chart's own Services. Sundae reads SUNDAE_* variables
      # as configuration, so keep them out.
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sundae
          image: {{ include "sundae.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: SUNDAE_DATA_PATH
              value: {{ .Values.dataPath | quote }}
            # The file must exist at this path: when it does not, Sundae
            # falls back to <data path>/config.yaml and writes defaults there.
            - name: SUNDAE_CONFIG_LOCATION
              value: {{ printf "%s/config.yaml" (.Values.configMountPath | trimSuffix "/") | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- if $cfg.ssh.enabled }}
            - name: ssh
              containerPort: {{ include "sundae.listenPort" (dict "name" "ssh" "addr" $cfg.ssh.listen_addr) }}
              protocol: TCP
            {{- end }}
            {{- if $cfg.http.enabled }}
            - name: http
              containerPort: {{ include "sundae.listenPort" (dict "name" "http" "addr" $cfg.http.listen_addr) }}
              protocol: TCP
            {{- end }}
            {{- if $cfg.stats.enabled }}
            - name: stats
              containerPort: {{ include "sundae.listenPort" (dict "name" "stats" "addr" $cfg.stats.listen_addr) }}
              protocol: TCP
            {{- end }}
            {{- if $cfg.git.enabled }}
            - name: git
              containerPort: {{ include "sundae.listenPort" (dict "name" "git" "addr" $cfg.git.listen_addr) }}
              protocol: TCP
            {{- end }}
          {{- if $cfg.http.enabled }}
          # /livez always answers 200; /readyz pings the database (pkg/web/health.go).
          startupProbe:
            httpGet:
              path: /livez
              port: http
              scheme: {{ $httpScheme }}
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
              scheme: {{ $httpScheme }}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: {{ $httpScheme }}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          {{- else if $cfg.ssh.enabled }}
          # The health endpoints live on the HTTP server, which is disabled.
          startupProbe:
            tcpSocket:
              port: ssh
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: ssh
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: ssh
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.dataPath | quote }}
            - name: config
              mountPath: {{ .Values.configMountPath | quote }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $openshellTLS }}
            - name: openshell-client-tls
              mountPath: {{ .Values.openshell.clientTLS.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if $openshellToken }}
            # A directory mount, not subPath, so a rotated Secret reaches the pod.
            - name: openshell-gateway-token
              mountPath: {{ .Values.openshell.gatewayToken.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if $ntfyToken }}
            # A directory mount, not subPath, so a rotated Secret reaches the pod.
            - name: ntfy-token
              mountPath: {{ .Values.notifications.ntfyToken.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if $s3Creds }}
            # A directory mount, not subPath, so a rotated Secret reaches the pod.
            - name: s3-credentials
              mountPath: {{ .Values.snapshots.s3Credentials.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.initialAdminKeysSecret.name }}
            - name: admin-keys
              mountPath: {{ .Values.initialAdminKeysSecret.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- range .Values.secretMounts }}
            - name: {{ printf "secret-%s" .name | quote }}
              mountPath: {{ .mountPath | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-config
        - name: tmp
          emptyDir: {}
        {{- if $openshellTLS }}
        - name: openshell-client-tls
          secret:
            secretName: {{ .Values.openshell.clientTLS.secretName | quote }}
            # Readable by the pod's fsGroup only.
            defaultMode: 0440
        {{- end }}
        {{- if $openshellToken }}
        - name: openshell-gateway-token
          secret:
            secretName: {{ .Values.openshell.gatewayToken.secretName | quote }}
            # Only the token key, as the file config.openshell.token_file names.
            items:
              - key: {{ .Values.openshell.gatewayToken.key | quote }}
                path: {{ .Values.openshell.gatewayToken.key | quote }}
            # Readable by the pod's fsGroup only.
            defaultMode: 0440
        {{- end }}
        {{- if $ntfyToken }}
        - name: ntfy-token
          secret:
            secretName: {{ .Values.notifications.ntfyToken.secretName | quote }}
            # Only the token key, as the file config.notifications.ntfy.token_file names.
            items:
              - key: {{ .Values.notifications.ntfyToken.key | quote }}
                path: {{ .Values.notifications.ntfyToken.key | quote }}
            # Readable by the pod's fsGroup only.
            defaultMode: 0440
        {{- end }}
        {{- if $s3Creds }}
        - name: s3-credentials
          secret:
            secretName: {{ .Values.snapshots.s3Credentials.secretName | quote }}
            {{- with .Values.snapshots.s3Credentials.key }}
            # Only the credentials key, as the file config.snapshots.s3.credentials_file names.
            items:
              - key: {{ . | quote }}
                path: {{ . | quote }}
            {{- end }}
            # Readable by the pod's fsGroup only.
            defaultMode: 0440
        {{- end }}
        {{- with .Values.initialAdminKeysSecret }}
        {{- if .name }}
        - name: admin-keys
          secret:
            secretName: {{ .name | quote }}
            items:
              - key: {{ .key | quote }}
                path: {{ .key | quote }}
            defaultMode: 0440
        {{- end }}
        {{- end }}
        {{- range .Values.secretMounts }}
        - name: {{ printf "secret-%s" .name | quote }}
          secret:
            secretName: {{ required "secretMounts[].secretName is required" .secretName | quote }}
            defaultMode: {{ .defaultMode | default 0440 }}
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- else if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  # Kubernetes keeps this claim when the release is uninstalled.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "sundae.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
