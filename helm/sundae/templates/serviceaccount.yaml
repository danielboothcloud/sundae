{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sundae.serviceAccountName" . }}
  labels:
    {{- include "sundae.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Sundae only talks to the Kubernetes API for the pod session runtime
# (config.sessions.runtime or a profile's runtime: pod).
automountServiceAccountToken: {{ include "sundae.podRuntime" . | eq "true" }}
{{- end }}
