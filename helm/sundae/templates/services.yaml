{{- $cfg := .Values.config }}
{{- if $cfg.ssh.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sundae.fullname" . }}-ssh
  labels:
    {{- include "sundae.labels" . | nindent 4 }}
  {{- with .Values.service.ssh.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.ssh.type }}
  ports:
    - name: ssh
      port: {{ .Values.service.ssh.port }}
      targetPort: ssh
      protocol: TCP
      {{- if and .Values.service.ssh.nodePort (ne .Values.service.ssh.type "ClusterIP") }}
      nodePort: {{ .Values.service.ssh.nodePort }}
      {{- end }}
  selector:
    {{- include "sundae.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if $cfg.http.enabled }}
---
# Git over HTTP, plus /livez and /readyz. This is the Service sandboxes clone
# from (config.openshell.clone_url).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sundae.fullname" . }}-http
  labels:
    {{- include "sundae.labels" . | nindent 4 }}
  {{- with .Values.service.http.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.http.type }}
  ports:
    - name: http
      port: {{ .Values.service.http.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "sundae.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if $cfg.stats.enabled }}
---
# Prometheus metrics at /metrics.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sundae.fullname" . }}-stats
  labels:
    {{- include "sundae.labels" . | nindent 4 }}
  {{- with .Values.service.stats.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: stats
      port: {{ .Values.service.stats.port }}
      targetPort: stats
      protocol: TCP
  selector:
    {{- include "sundae.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if $cfg.git.enabled }}
---
# The unauthenticated git:// daemon.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sundae.fullname" . }}-git
  labels:
    {{- include "sundae.labels" . | nindent 4 }}
  {{- with .Values.service.git.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.git.type }}
  ports:
    - name: git
      port: {{ .Values.service.git.port }}
      targetPort: git
      protocol: TCP
  selector:
    {{- include "sundae.selectorLabels" . | nindent 4 }}
{{- end }}
