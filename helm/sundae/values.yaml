# Default values for the Sundae chart.
#
# Sundae's whole configuration is the `config` map below. It is rendered
# into a ConfigMap and mounted read-only; nothing is configured through
# SUNDAE_* environment variables unless you add them under `extraEnv`.

image:
  # REQUIRED. Registry path of the Sundae image, e.g. ghcr.io/<owner>/sundae.
  repository: ""
  # Defaults to the chart appVersion when empty.
  tag: ""
  # When set, takes precedence over the tag (repository@digest).
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# There is deliberately no replica count. Sundae keeps a SQLite database
# and bare repositories on one ReadWriteOnce volume, so the chart always runs
# exactly one pod, as a StatefulSet: a replacement pod is only created after
# the previous one is gone, so two pods never share the data volume.

# Public SSH keys (authorized_keys format) that are always administrators.
# Merged with config.initial_admin_keys. Public keys only: this ends up in the
# ConfigMap.
initialAdminKeys: []
#  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... you@example.com"

# Admin public keys from an existing Secret instead (e.g. one synced by
# External Secrets; create it with extraObjects below). The key holds
# authorized_keys lines, one per line. The chart mounts it and adds the file
# to config.initial_admin_keys; both sources are merged. Read at startup.
initialAdminKeysSecret:
  name: ""
  key: keys
  mountPath: /etc/sundae-admin-keys

# Extra Kubernetes objects rendered with the release, e.g. an ExternalSecret
# for the Secrets this chart mounts. Each item is a map or a string; both are
# rendered with `tpl`, so they can use {{ .Release.Namespace }} and friends.
extraObjects: []
#  - apiVersion: external-secrets.io/v1
#    kind: ExternalSecret
#    metadata:
#      name: sundae-admin-keys
#    spec:
#      secretStoreRef: {kind: ClusterSecretStore, name: my-store}
#      target: {name: sundae-admin-keys}
#      data:
#        - secretKey: keys
#          remoteRef: {key: sundae, property: admin-keys}
#  # Credentials of the OpenShell provider my-github
#  # (config.openshell.providers): each secretKey is a credential key, an
#  # environment variable name. Mounted with the "provider-my-github"
#  # example in `secretMounts`.
#  - apiVersion: external-secrets.io/v1
#    kind: ExternalSecret
#    metadata:
#      name: sundae-provider-my-github
#    spec:
#      refreshInterval: 1h
#      secretStoreRef: {kind: ClusterSecretStore, name: my-store}
#      target: {name: sundae-provider-my-github}
#      data:
#        - secretKey: GITHUB_TOKEN
#          remoteRef: {key: sundae, property: github-token}

# Where the data volume is mounted and where the read-only config is mounted.
# The chart sets SUNDAE_DATA_PATH and SUNDAE_CONFIG_LOCATION to match.
dataPath: /sundae
configMountPath: /etc/sundae

# The Sundae configuration file, key for key (see pkg/config/file.go).
# Relative paths are resolved against the data path.
#
# Do NOT put secrets here: this map becomes a ConfigMap. The chart refuses to
# render when config.openshell.token is set; use openshell.gatewayToken, which
# mounts the token from a Secret and sets config.openshell.token_file. For
# other secret values, see `secretMounts` (files) and `extraEnv` (environment
# variables from Secrets).
#
# The listen ports are read from the listen_addr values: the container ports,
# Service target ports and probes all follow them.
config:
  name: "Sundae"

  log:
    # "json", "logfmt" or "text".
    format: "text"
    time_format: "2006-01-02 15:04:05"
    # Leave empty to log to stderr, which is what you want in a container.
    path: ""

  ssh:
    enabled: true
    listen_addr: ":23231"
    # How users reach the SSH server from outside the cluster. Shown in clone
    # URLs. Set it to match the SSH Service (service.ssh).
    public_url: "ssh://localhost:23231"
    # Generated on first start and kept on the data volume.
    key_path: "ssh/sundae_host_ed25519"
    client_key_path: "ssh/sundae_client_ed25519"
    max_timeout: 0
    idle_timeout: 600

  # The unauthenticated git:// daemon. Off by default in this chart; a Service
  # for it is only created when it is enabled.
  git:
    enabled: false
    listen_addr: ":9418"
    public_url: "git://localhost"
    max_timeout: 0
    idle_timeout: 3
    max_connections: 32

  http:
    enabled: true
    listen_addr: ":23232"
    tls_key_path: ""
    tls_cert_path: ""
    # How clients reach the HTTP server. Shown in clone URLs and always allowed
    # as a CORS origin.
    public_url: "http://localhost:23232"
    cors:
      allowed_headers:
        - "Accept"
        - "Accept-Language"
        - "Content-Language"
        - "Content-Type"
        - "Origin"
        - "X-Requested-With"
        - "User-Agent"
        - "Authorization"
        - "Access-Control-Request-Method"
        - "Access-Control-Allow-Origin"
      allowed_origins: []
      allowed_methods:
        - "GET"
        - "HEAD"
        - "POST"
        - "PUT"
        - "OPTIONS"

  stats:
    enabled: true
    # Sundae's own default is localhost:23233, which a Service cannot
    # reach. The chart refuses loopback listen addresses for that reason.
    listen_addr: ":23233"

  db:
    driver: "sqlite"
    # For postgres, do not put a password here. Leave the driver set and pass
    # SUNDAE_DB_DATA_SOURCE from a Secret through `extraEnv`.
    data_source: "sundae.db?_pragma=busy_timeout(5000)&_pragma=foreign_keys(1)"

  lfs:
    enabled: true
    ssh_enabled: false

  jobs:
    mirror_pull: "@every 10m"

  # OpenShell agent sessions (ssh -t <server> session start <repo>).
  openshell:
    # Implied by openshell.install (the embedded gateway).
    enabled: false
    # The gateway's gRPC address. http:// is plaintext; https:// or no scheme
    # uses TLS. Required when enabled, except with openshell.install, where
    # empty means the embedded gateway's Service. For the OpenShell chart
    # installed separately as release `openshell` in the same namespace
    # (chart 0.1.8 defaults):
    # https://openshell.<namespace>.svc.cluster.local:8080
    gateway_address: ""
    workspace: "default"
    # The default sandbox image. It must provide git and jj. Required when
    # enabled. Build one from deploy/sandbox/Containerfile, e.g.
    # <registry>/sundae-sandbox:<tag>.
    image: ""
    # Path to a file holding the gateway bearer token. Leave empty to have the
    # chart point it at the mounted openshell.gatewayToken secret, if any. Do
    # not set `token` here: the chart refuses it.
    token_file: ""
    # Client TLS files. Leave these empty to have the chart point them at the
    # mounted openshell.clientTLS secret (ca.crt, tls.crt, tls.key).
    tls_ca: ""
    tls_cert: ""
    tls_key: ""
    insecure: false
    # The HTTP base URL sandboxes use to clone and push. When empty, the chart
    # sets this release's in-cluster HTTP Service,
    # http://<fullname>-http.<namespace>.svc.cluster.local:<service.http.port>.
    clone_url: ""
    # Lifetime of the git token in a sandbox. Renewed on every session start
    # and attach.
    token_ttl: "24h"
    # The program a session runs when no profile sets one. It runs in an osewa
    # session in the sandbox, so it outlives the SSH connection.
    command: "bash -l"
    # OpenShell providers Sundae creates on the gateway and keeps up to date,
    # for profiles to attach (sessions.profiles.<name>.providers). Each one's
    # credentials are read from credentials_dir: one file per credential,
    # named for its key (an environment variable name, e.g. GITHUB_TOKEN),
    # holding the value. Mount a Secret there with `secretMounts` below
    # (synced e.g. by the ExternalSecret in the `extraObjects` example); a
    # rotated Secret reaches the gateway on the next sync. `config` is the
    # provider's non-secret settings, `type` its provider profile ID
    # (`openshell profile list`). Sundae labels the providers it creates
    # sundae.managed=true and does not touch an existing provider of the same
    # name unless `adopt: true`. Providers a profile lists that are not
    # declared here are attached by name, as before. `ssh <host> openshell
    # providers` (admins) shows their state. See the top-level README,
    # "Providers".
    providers: []
    #  - name: my-github
    #    type: github
    #    credentials_dir: /etc/sundae-providers/my-github
    #  - name: my-claude
    #    type: anthropic
    #    credentials_dir: /etc/sundae-providers/my-claude
    #    config:
    #      ANTHROPIC_BASE_URL: https://api.anthropic.com
    # How often the declared providers are synced (their files read and the
    # gateway updated when they changed). At least 10s.
    providers_sync: 1m
    # Delete providers Sundae created that are no longer declared. Off: they
    # are kept and listed as undeclared.
    prune_providers: false
    # The policy of the sandboxes Sundae creates. OpenShell denies a sandbox
    # all network access its policy does not allow. "sundae" (the default):
    # Sundae sends OpenShell's restrictive default policy plus network rules
    # letting any program in the sandbox reach clone_url (git, jj) and, with
    # config.snapshots.s3 enabled, the S3 endpoint (curl), and the rules in
    # network_policies. "image": Sundae sends none, so the image's
    # /etc/openshell/policy.yaml applies, or OpenShell's default, which
    # allows no network access. Applies to sandboxes created after the
    # change; existing ones keep theirs. A gateway-global policy (`openshell
    # policy set --global`) replaces either. See the chart README, "Sandbox
    # egress".
    sandbox_policy: sundae
    # Extra network rules for sandbox_policy: sundae, e.g. an agent's API
    # that no attached provider covers (providers add their own rules).
    # Names may not start with "sundae_". An endpoint has a host (a name, an
    # IP or *.domain) or allowed_ips, and port or ports; protocol is empty
    # (uninspected; right for most clients), rest (with access: read-only,
    # read-write or full) or tcp. binaries are the programs allowed; empty
    # means any.
    network_policies: []
    #  - name: anthropic
    #    endpoints:
    #      - host: api.anthropic.com
    #        port: 443
    #    binaries: [/usr/local/bin/claude]

  # What runs in the sandboxes: several named sessions per repository
  # (session start <repo> --name <name>), each from a profile.
  sessions:
    osewa:
      # The pinned osewa builds this image carries, uploaded to sandboxes
      # whose image lacks osewa (the sandbox image in deploy/sandbox has it).
      binary_dir: "/usr/local/share/sundae/osewa"
      # Loopback port of the osewa server inside each sandbox.
      port: 7322
    status:
      # How often Sundae reads each running session's OSC 7501 status
      # (`osewa local ls`, one exec per sandbox) for `session ls` and
      # notifications. At least 1s.
      poll_interval: 10s
    suspend:
      # Park (suspend) a session's sandbox once nobody has been attached and it
      # has not reported "working" for `after`. Needs an OpenShell compute
      # driver with suspend support; the OpenShell 0.1.8 Kubernetes driver has
      # none, and Sundae then leaves sandboxes running (logged once).
      enabled: true
      after: 30m
      # Where the gateway cannot suspend (the 0.1.8 Kubernetes driver):
      # "none" leaves the sandbox running; "snapshot" saves /sandbox to S3
      # (config.snapshots.s3 must be enabled) and deletes the sandbox, which
      # stops the session's program until the next start or attach.
      fallback: none
    signals:
      # How many signals (session status changes and lifecycle events) to
      # keep for `session signals` and the TUI, across all users. In memory
      # only: the feed is empty after a restart. At most 100000.
      keep: 1000
    # Named presets for `session start --profile <name>`. Empty image and
    # command fall back to openshell.image and openshell.command.
    # `providers` names OpenShell providers (declared in
    # config.openshell.providers, or created on the gateway with
    # `openshell provider create`) to attach to this profile's sandboxes
    # only; their programs get the credentials as placeholders the sandbox
    # proxy resolves. The provider profiles' binaries and endpoints, or
    # config.openshell.network_policies, must allow the requests. See the
    # top-level README,
    # "Providers".
    profiles: {}
    #  claude:
    #    image: ghcr.io/me/agent-claude:latest
    #    command: claude
    #    providers: [my-claude, my-github]
    # The profile for sessions started without --profile, by repository name
    # glob ("*" does not cross "/", "**" does; the most specific match wins).
    repos: {}
    #  "infra/*":
    #    profile: claude
    # The git and jj identity (user.name, user.email) commits are made as in
    # session checkouts of repositories not imported from a forge, and of
    # those whose forge has no git_identity. Written into each checkout's
    # repository config on every start and attach; ~/.gitconfig is left
    # alone. Server-wide: every user's sessions use it. Unset, sandboxes get
    # no identity. Semantics in the top-level README, "Git identity".
    #git_identity:
    #  name: Jane Doe
    #  email: jane@example.com

  # How new repositories are initialised: templates for `repo create
  # --template <name>` and the TUI's new-repository form. A template is an
  # existing Sundae repository whose tree (at ref, under subdir) becomes
  # the new repository's single initial commit, authored by its creator.
  # Creating from one needs read access to its repository. Semantics in the
  # top-level README, "Project templates and profiles".
  projects:
    templates: {}
    #  go-service:
    #    repo: templates/go-service
    #    ref: main
    #    subdir: ""
    #    description: Go service with a Containerfile and CI
    #    # A sessions.profiles entry stored as the new repository's default
    #    # session profile (`repo profile`).
    #    profile: claude

  # GitHub and GitLab accounts whose repositories Sundae discovers,
  # imports and keeps in sync (ssh <server> forge --help). Tokens and SSH
  # keys are only read from files: put each in an existing Secret, mount it
  # with `secretMounts` below, and point token_file (ssh_key_file) at the
  # mounted file. Do not put a token here; Sundae rejects a `token` key.
  forges: []
  #  - name: github
  #    kind: github
  #    # url defaults to https://github.com (https://gitlab.com for gitlab).
  #    # A self-hosted forge on a private address is allowed by declaring it.
  #    token_file: /etc/sundae-forges/github/token
  #    include: ["me/*"]
  #    exclude: []
  #    sync: 10m
  #    # prefix defaults to the name: me/tool is imported as github/me/tool.
  #    # Optional: the identity commits are made as in agent sessions of
  #    # this forge's repositories (else sessions.git_identity). Server-wide,
  #    # like the token.
  #    git_identity:
  #      name: Jane Doe
  #      email: 12345+jane@users.noreply.github.com
  #  # Git over SSH instead of HTTPS (import, sync, push); the API still uses
  #  # token_file. The key and known_hosts come from a Secret mounted with
  #  # `secretMounts` below (see the "gitlab-ssh" example there).
  #  - name: gitlab
  #    kind: gitlab
  #    url: https://gitlab.example.com
  #    token_file: /etc/sundae-forges/gitlab/token
  #    ssh_key_file: /etc/sundae-forges/gitlab-ssh/ssh-privatekey
  #    # Required unless the SSH host is github.com or gitlab.com (built in).
  #    ssh_known_hosts_file: /etc/sundae-forges/gitlab-ssh/known_hosts
  #    # Default ssh://git@<url host>:22.
  #    ssh_url: ssh://git@gitlab-ssh.example.com:2222

  # Notifications about agent sessions, pushed to a phone through ntfy
  # (https://ntfy.sh or a self-hosted server). Off by default; while
  # ntfy.enabled is false nothing here is checked. Semantics in the top-level
  # README, "Notifications".
  notifications:
    # Keep the key quoted: Helm (YAML 1.1) reads a bare `on:` as `true`, and
    # the chart refuses that. Triggers: blocked, done, error, working, idle,
    # session_failed, forge_failed.
    "on": ["blocked", "done", "error"]
    # Per-session rate limit; "0s" sends every change at once.
    debounce: "30s"
    ntfy:
      enabled: false
      # The server's base URL, without the topic. Sundae needs egress to
      # it.
      url: ""
      # 1 to 64 letters, digits, '-' or '_'. Anyone who knows a topic on a
      # public server can read it: use an unguessable name, or an
      # access-controlled topic and notifications.ntfyToken below.
      topic: ""
      # Leave empty to have the chart point it at the mounted
      # notifications.ntfyToken secret, if any. Do not set `token`.
      token_file: ""
      # Optional URL opened when a notification is tapped, with the
      # placeholders {repo}, {session}, {sandbox} and {user}.
      click_url: ""

  # Snapshots of a session's /sandbox in an S3 bucket (AWS S3, or MinIO,
  # Ceph RGW and other S3-compatible stores). Off by default; while
  # s3.enabled is false nothing here is checked. Semantics in the top-level
  # README, "S3 snapshots". The sandboxes upload and download the snapshot
  # themselves through presigned URLs; the sandbox policy Sundae sends
  # (config.openshell.sandbox_policy: sundae) allows the endpoint. Sundae
  # needs egress to it too.
  snapshots:
    s3:
      enabled: false
      # Empty for AWS S3; e.g. http://rook-ceph-rgw-store.rook-ceph.svc:80
      # for Ceph RGW.
      endpoint: ""
      # Required for AWS; defaults to us-east-1 with an endpoint.
      region: ""
      bucket: ""
      prefix: "sundae/sessions"
      # Leave empty to have the chart point it at the mounted
      # snapshots.s3Credentials secret. Never put keys here.
      credentials_file: ""
      # "AES256", "aws:kms" or "" (the bucket's default encryption).
      sse: ""
      # Most MinIO and Ceph RGW deployments need path-style addressing.
      path_style: false
      # Keep the key quoted (see notifications). "end", and "park" for a
      # backup before every memory-retaining park.
      "on": ["end"]

  # Leave empty; use the top-level initialAdminKeys instead.
  initial_admin_keys: []

  # Repository created on boot when it does not exist. Empty disables it.
  default_repo: ""

# Chart-side wiring for config.openshell (clientTLS, gatewayToken), and the
# embedded OpenShell gateway (install and every other key). The wiring is
# only used when config.openshell.enabled or openshell.install is true.
openshell:
  # Install the NVIDIA OpenShell gateway with this release, in its namespace
  # (the OpenShell chart oci://ghcr.io/nvidia/openshell/helm-chart 0.1.8, a
  # dependency of this chart), and point Sundae at it. This implies
  # config.openshell.enabled; an empty config.openshell.gateway_address
  # becomes the gateway's Service,
  # https://<release>-openshell.<namespace>.svc.cluster.local:8080, and the
  # client certificate its certgen hook creates (server.tls.clientTlsSecretName,
  # openshell-client-tls) is mounted; clientTLS.secretName below is then
  # ignored. config.openshell.image is still required. The gateway's
  # Kubernetes driver needs Agent Sandbox: set agentSandbox.install too,
  # unless the cluster already runs it. See README.md, "Embedded OpenShell
  # and Agent Sandbox".
  install: false
  clientTLS:
    # An existing Secret in this namespace holding the gateway's client
    # certificate, with the keys ca.crt, tls.crt and tls.key. The OpenShell
    # chart creates it as openshell-client-tls. Set to "" to mount nothing
    # (for a plaintext or token-only gateway). Not used with install: true.
    secretName: openshell-client-tls
    mountPath: /etc/openshell-tls
  # Optional bearer token for the gateway, from an existing Secret in this
  # namespace. Off by default: the OpenShell chart's gateway authenticates
  # Sundae by its client certificate (clientTLS above). When secretName is
  # set, the one key is mounted read-only as <mountPath>/<key> and
  # config.openshell.token_file points at it. The directory is mounted rather
  # than the single file, so a rotated Secret reaches the pod; Sundae
  # reads the file again for every session command.
  gatewayToken:
    secretName: ""
    key: token
    mountPath: /etc/openshell-token

  # Everything else under `openshell` is passed to the OpenShell chart (its
  # values.yaml documents them all) and only used with install: true. The
  # ones this chart sets or you will likely need:
  agentSandbox:
    preflight:
      # The OpenShell chart refuses to render unless the cluster already
      # serves agents.x-k8s.io/v1beta1 or v1alpha1. Off here, because it
      # fails whenever the API is not visible at render time: with
      # agentSandbox.install the CRDs come with this same release (helm
      # template and Argo CD render before anything is applied, and helm
      # upgrade does not install a subchart's crds/), and helm template or
      # Argo CD cannot see the cluster's APIs at all. Turn it on only for
      # helm install/upgrade against a cluster that runs Agent Sandbox from
      # elsewhere.
      enabled: false
  server:
    # StorageClass and default size of each sandbox's workspace volume
    # (/sandbox: the checkouts and the sandbox user's home), one
    # ReadWriteOnce PVC per sandbox. Use block storage. Empty: the cluster's
    # default StorageClass and OpenShell's default size, 2Gi.
    workspaceStorageClass: ""
    workspaceDefaultStorageSize: ""
    # The gateway's own SQLite volume. Block storage, not NFS. Empty: the
    # cluster's default StorageClass, 1Gi. Immutable after install.
    dataStorageClass: ""
    credentialStorage:
      # The Secret holding the key that encrypts provider credentials in the
      # gateway's database: key `key-encryption-key`, a base64-encoded
      # 32-byte value (`openssl rand -base64 32`). With
      # openshell.credentialKey.generate (the default) this chart creates it
      # (see there); otherwise it must exist, e.g. an ExternalSecret in
      # extraObjects. Empty, with generate off: the OpenShell chart generates
      # it at render time and finds it again with `lookup`, which only works
      # with helm install/upgrade (helm template and Argo CD render a new key
      # every time, which makes stored credentials unreadable).
      existingSecret: openshell-credential-key
  credentialKey:
    # Generate the credentialStorage.existingSecret Secret in the cluster,
    # once, with a pre-install/pre-upgrade hook Job (an Argo CD PreSync
    # hook) running this chart's image: 32 random bytes, base64-encoded. An
    # existing Secret is never changed, and the Secret is not part of the
    # release, so uninstalling, pruning or re-rendering keeps it. Works the
    # same with helm install, helm template and Argo CD. Keep the Secret if
    # you reinstall: losing it makes the stored credentials unreadable. Set
    # to false when you provide the Secret yourself (an ExternalSecret, to
    # back it up outside the cluster), so the Job cannot create it first.
    # Ignored when an OpenShell credential driver (kubernetesSecrets, vault)
    # is enabled: those do not use the key.
    generate: true

# The Kubernetes Agent Sandbox controller and its CRDs
# (https://github.com/kubernetes-sigs/agent-sandbox v1.0.10, vendored in
# helm/vendor/agent-sandbox), which OpenShell's Kubernetes driver needs.
# Cluster-wide: install it once per cluster, and leave this off when the
# cluster already has it. Every key other than `install` is passed to the
# agent-sandbox chart.
agentSandbox:
  install: false
  image:
    # Required by the agent-sandbox chart. Matches the vendored chart.
    tag: v1.0.10
  namespace:
    # The controller runs in this release's namespace (name ""), instead of
    # the agent-sandbox chart's own agent-sandbox-system namespace.
    create: false
    name: ""
  # The controller image is distroless and runs as UID 65532.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# Chart-side wiring for config.notifications. Only used when
# config.notifications.ntfy.enabled is true.
notifications:
  # Optional ntfy access token (tk_...), from an existing Secret in this
  # namespace. When secretName is set, the one key is mounted read-only as
  # <mountPath>/<key> and config.notifications.ntfy.token_file points at it.
  # The directory is mounted rather than the single file, so a rotated Secret
  # reaches the pod; Sundae reads the file again for every notification.
  ntfyToken:
    secretName: ""
    key: token
    mountPath: /etc/sundae-ntfy

# Chart-side wiring for config.snapshots. Only used when
# config.snapshots.s3.enabled is true.
snapshots:
  # The S3 access key, from an existing Secret in this namespace. When
  # secretName is set the Secret is mounted read-only at mountPath and
  # config.snapshots.s3.credentials_file points at it:
  #   - with `key` set, at <mountPath>/<key>, a file in the AWS
  #     shared-credentials format ([default] aws_access_key_id = ...,
  #     aws_secret_access_key = ...);
  #   - with `key` empty, at the directory itself, which must hold the keys
  #     AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY: the Secret a Rook
  #     ObjectBucketClaim creates can be used as it is.
  # The directory is mounted rather than a subPath, so a rotated Secret
  # reaches the pod; Sundae reads the keys again for every operation.
  s3Credentials:
    secretName: ""
    key: credentials
    mountPath: /etc/sundae-s3

# Extra existing Secrets mounted read-only as files, for anything the config
# refers to by path (http.tls_key_path, ssh.key_path, ...).
secretMounts: []
#  - name: http-tls
#    secretName: sundae-http-tls
#    mountPath: /etc/sundae-tls
#  # A forge token, for config.forges[].token_file
#  # (/etc/sundae-forges/github/token). The directory is mounted, not a
#  # subPath, so a rotated Secret reaches the pod; Sundae reads the file
#  # again for every forge operation.
#  - name: github-token
#    secretName: sundae-github-token
#    mountPath: /etc/sundae-forges/github
#  # A forge SSH key, for config.forges[].ssh_key_file and
#  # ssh_known_hosts_file: a Secret with keys `ssh-privatekey` and,
#  # optionally, `known_hosts`, e.g.
#  #   kubectl create secret generic sundae-gitlab-ssh \
#  #     --from-file=ssh-privatekey=./id_ed25519 \
#  #     --from-file=known_hosts=./known_hosts
#  # (or `type: kubernetes.io/ssh-auth`). The default mode 0440 is fine:
#  # Sundae hands ssh a private 0600 copy of the key for every operation.
#  - name: gitlab-ssh
#    secretName: sundae-gitlab-ssh
#    mountPath: /etc/sundae-forges/gitlab-ssh
#  # The credentials of an OpenShell provider, for
#  # config.openshell.providers[].credentials_dir
#  # (/etc/sundae-providers/my-github): every key of the Secret is a
#  # credential, named for its key. The directory is mounted, not a subPath,
#  # so a rotated Secret reaches the pod and the next sync.
#  - name: provider-my-github
#    secretName: sundae-provider-my-github
#    mountPath: /etc/sundae-providers/my-github

# Extra environment variables. SUNDAE_* variables override the config
# file, so this is how a secret value without a *_file setting gets in
# without touching the ConfigMap. For the gateway token, use
# openshell.gatewayToken instead.
extraEnv: []
#  - name: SUNDAE_DB_DATA_SOURCE
#    valueFrom:
#      secretKeyRef:
#        name: sundae-postgres
#        key: data-source

persistence:
  # When false the data lives in an emptyDir and is lost with the pod.
  enabled: true
  # Use an existing claim instead of the StatefulSet's own claim template.
  existingClaim: ""
  # Empty uses the cluster's default StorageClass.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

service:
  ssh:
    # ClusterIP, NodePort or LoadBalancer. Users need to reach this from
    # outside the cluster, so it will usually be LoadBalancer or NodePort.
    type: ClusterIP
    port: 23231
    # Only used for NodePort (and LoadBalancer). Empty lets Kubernetes pick.
    nodePort: null
    annotations: {}
  http:
    type: ClusterIP
    port: 23232
    annotations: {}
  # Prometheus metrics at /metrics. Always ClusterIP.
  stats:
    port: 23233
    annotations: {}
  # Only created when config.git.enabled is true.
  git:
    type: ClusterIP
    port: 9418
    annotations: {}

serviceAccount:
  create: true
  # Defaults to the release's full name when create is true.
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# The image runs as 10001:10001 (see the Containerfile). fsGroup makes the
# data volume group-writable for that user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  # Keep this. With "Always" the kubelet re-adds group permissions to every
  # file on each mount, and the ssh client then rejects the mirror client key
  # as too open.
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # The data volume and an emptyDir at /tmp are the only writable paths.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Seconds Kubernetes waits for Sundae to shut down.
terminationGracePeriodSeconds: 30

# /livez and /readyz are served by the HTTP server. When config.http.enabled
# is false the probes fall back to a TCP check on the SSH port.
probes:
  startup:
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 60
  liveness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
