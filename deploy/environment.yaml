# Environment-specific values for deploy/helmfile.yaml.
#
# Edit this file for your cluster, or leave it alone and override single values
# on the command line:
#
#   helmfile -f deploy/helmfile.yaml \
#     --state-values-set openshell.sandboxImage=ghcr.io/danielboothcloud/sundae-sandbox:abc1234 \
#     --state-values-set sundae.image.tag=abc1234 sync
#
# Values marked REQUIRED have no usable default; helmfile stops with a message
# naming the value when one is empty.

# The one namespace everything application-side goes into: the OpenShell
# gateway, the sandboxes it creates, and Sundae. They share it so Sundae
# can mount the gateway's client TLS secret directly.
namespace: sundae

agentSandbox:
  # Install the Kubernetes Agent Sandbox CRDs and controller (pinned to v1.0.10
  # in helmfile.yaml). Set to false when the cluster already has them.
  enabled: true

openshell:
  # REQUIRED. The default image for the sandboxes Sundae starts. It must
  # provide git and jj, and the cluster must be able to pull it. Build it from
  # sandbox/Containerfile and push it (README.md, step 1, "Sandbox"), then set
  # the image and tag you pushed here, e.g. ghcr.io/danielboothcloud/sundae-sandbox:abc1234.
  sandboxImage: ""

  # Extra values for the OpenShell chart, merged over what helmfile sets (see
  # values/openshell.yaml.gotmpl). For example a StorageClass when the cluster
  # has no default one:
  #   chartValues:
  #     server:
  #       dataStorageClass: longhorn
  #       workspaceStorageClass: longhorn
  chartValues: {}

sundae:
  image:
    # Placeholder registry path: confirm it, or point it at your own registry.
    repository: ghcr.io/danielboothcloud/sundae
    # REQUIRED. The tag you built and pushed (see README.md). No image is
    # published for this fork, so there is no default.
    tag: ""

  # Public SSH keys of the server administrators, authorized_keys format.
  # Without at least one, nobody can administer the server.
  initialAdminKeys: []
  #  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... you@example.com"

  ssh:
    # How users reach the SSH server from outside the cluster: ClusterIP (only
    # reachable through `kubectl port-forward`), NodePort or LoadBalancer.
    serviceType: ClusterIP
    # Annotations for the SSH Service, e.g. to request a fixed address from
    # Cilium LB-IPAM:
    #   lbipam.cilium.io/ips: "192.0.2.10"
    serviceAnnotations: {}
    # The address users put in `ssh` and `git clone` commands. Sundae only
    # shows it in clone URLs; set it once you know the external address.
    publicURL: "ssh://localhost:23231"

  storage:
    # Size of the data volume (repositories, SQLite database, SSH host keys).
    # It cannot be changed through helmfile after the first install.
    size: 10Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""

  # Extra values for the Sundae chart, merged over what helmfile sets (see
  # values/sundae.yaml.gotmpl and helm/sundae/values.yaml).
  #
  # The gateway authenticates Sundae by its client certificate, so no
  # gateway token is set. If your gateway also wants a bearer token, put it in
  # a Secret in `namespace` and name it here; the chart mounts it as a file and
  # sets openshell.token_file (a token is never put in the ConfigMap):
  #   chartValues:
  #     openshell:
  #       gatewayToken:
  #         secretName: openshell-gateway-token
  #         key: token
  #
  # Forges (GitHub, GitLab) are declared under config.forges, with each token
  # mounted from a Secret through secretMounts (see the chart's values.yaml
  # and the top-level README, "Forges"):
  #   chartValues:
  #     secretMounts:
  #       - name: github-token
  #         secretName: sundae-github-token
  #         mountPath: /etc/sundae-forges/github
  #     config:
  #       forges:
  #         - name: github
  #           kind: github
  #           token_file: /etc/sundae-forges/github/token
  #           include: ["me/*"]
  #
  # Notifications through ntfy are off by default. Quote the "on" key: Helm
  # reads a bare on: as true. An ntfy access token comes from a Secret in
  # `namespace`; the chart mounts it and sets notifications.ntfy.token_file:
  #   chartValues:
  #     notifications:
  #       ntfyToken:
  #         secretName: sundae-ntfy-token
  #         key: token
  #     config:
  #       notifications:
  #         "on": [blocked, done, error]
  #         ntfy:
  #           enabled: true
  #           url: https://ntfy.sh
  #           topic: my-unguessable-topic
  #
  # Session profiles: named presets for `session start <repo> --profile
  # <name>`, and per-repository defaults by glob. Empty fields fall back to
  # openshell.sandboxImage and `bash -l`:
  #   chartValues:
  #     config:
  #       sessions:
  #         profiles:
  #           claude:
  #             image: ghcr.io/you/agent-claude:1.0
  #             command: claude
  #         repos:
  #           "infra/*":
  #             profile: claude
  #
  # Project templates: `repo create <name> --template go-service` (and the
  # TUI's new-repository form, n on Repositories) seeds the new repository
  # with one commit holding the template repository's tree. The template
  # repository must exist in Sundae; the profile, if set, becomes the new
  # repository's default session profile (`repo profile`):
  #   chartValues:
  #     config:
  #       projects:
  #         templates:
  #           go-service:
  #             repo: templates/go-service
  #             ref: main
  #             description: Go service with a Containerfile and CI
  #             profile: claude
  #
  # Session status and parking: how often Sundae reads each session's
  # status, and when it suspends an idle one. The OpenShell 0.1.8 Kubernetes
  # compute driver cannot suspend; Sundae logs that once and leaves
  # sandboxes running, so `enabled: false` only silences the attempt:
  #   chartValues:
  #     config:
  #       sessions:
  #         status:
  #           poll_interval: 10s
  #         suspend:
  #           enabled: true
  #           after: 30m
  #
  # S3 snapshots of each session's /sandbox, off by default (top-level README,
  # "S3 snapshots"). The access key comes from a Secret in `namespace`; with
  # `key: ""` the Secret is mounted as a directory holding AWS_ACCESS_KEY_ID
  # and AWS_SECRET_ACCESS_KEY, which is what a Rook ObjectBucketClaim creates.
  # The sandbox network policy must let curl reach the endpoint. With
  # fallback: snapshot, idle sessions the gateway cannot suspend are parked
  # to S3 (their sandbox deleted, their program stopped):
  #   chartValues:
  #     snapshots:
  #       s3Credentials:
  #         secretName: sundae-snapshots   # the ObjectBucketClaim's name
  #         key: ""
  #     config:
  #       snapshots:
  #         s3:
  #           enabled: true
  #           endpoint: http://rook-ceph-rgw-store.rook-ceph.svc:80
  #           bucket: sundae-snapshots-<generated>   # the OBC's BUCKET_NAME
  #           path_style: true
  #           "on": [end]
  #       sessions:
  #         suspend:
  #           fallback: snapshot
  chartValues: {}
