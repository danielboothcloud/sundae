# Sundae next to an NVIDIA OpenShell gateway, on Kubernetes.
#
#   1. agent-sandbox  the Agent Sandbox CRDs and controller OpenShell needs
#   2. openshell      the OpenShell gateway (creates the mTLS secrets)
#   3. sundae         Sundae, configured to start sandboxes through 2
#
# 2 and 3 share one namespace (`namespace` in environment.yaml) so Sundae
# can mount the gateway's client TLS secret. See README.md for the commands.
#
# This file is plain YAML. Only release fields such as `namespace` and the
# values/*.gotmpl files are templated.

environments:
  default:
    values:
      - environment.yaml
---
helmDefaults:
  createNamespace: true
  # Wait for each release to be ready before starting the next one.
  wait: true
  timeout: 600

releases:
  # Cluster-scoped prerequisite of OpenShell, from the project's own Helm chart
  # in its repository at the v1.0.10 tag. Helm installs the CRDs from the
  # chart's crds/ directory and never upgrades or deletes them.
  - name: agent-sandbox
    namespace: agent-sandbox-system
    chart: git::https://github.com/kubernetes-sigs/agent-sandbox.git@helm?ref=v1.0.10
    # Skipped when agentSandbox.enabled is false in environment.yaml.
    condition: agentSandbox.enabled
    values:
      - values/required.yaml.gotmpl
      - image:
          tag: v1.0.10
        # helmfile creates the release namespace; the chart must not as well.
        namespace:
          create: false
          name: agent-sandbox-system

  # The release name is the gateway's Service name (openshell), which
  # values/sundae.yaml.gotmpl uses for gateway_address.
  - name: openshell
    namespace: '{{ .Values.namespace }}'
    chart: oci://ghcr.io/nvidia/openshell/helm-chart
    version: 0.1.8
    labels:
      values: openshell
    needs:
      - agent-sandbox-system/agent-sandbox
    values:
      - values/required.yaml.gotmpl
      - values/openshell.yaml.gotmpl
      - values/passthrough.yaml.gotmpl

  # The release name is part of the Service name sandboxes clone from
  # (sundae-http); do not change it without changing
  # values/sundae.yaml.gotmpl.
  - name: sundae
    namespace: '{{ .Values.namespace }}'
    chart: ./helm/sundae
    labels:
      values: sundae
    needs:
      - '{{ .Values.namespace }}/openshell'
    values:
      - values/required.yaml.gotmpl
      - values/sundae.yaml.gotmpl
      - values/passthrough.yaml.gotmpl
