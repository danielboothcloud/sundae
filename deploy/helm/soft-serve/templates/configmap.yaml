apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soft-serve.fullname" . }}-config
  labels:
    {{- include "soft-serve.labels" . | nindent 4 }}
data:
  # Mounted read-only at {{ .Values.configMountPath }}/config.yaml. Soft Serve only reads it.
  config.yaml: |
    {{- include "soft-serve.config" . | nindent 4 }}
