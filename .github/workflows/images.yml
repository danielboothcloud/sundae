name: images

# Build the Sundae server image and the sandbox image for linux/amd64 and
# push them to GHCR. Runs on main, develop and version tags; can be run by hand.
# Tags: short commit sha, branch name, and semver for v* tags. The chart is
# published to oci://ghcr.io/<owner>/charts/sundae (see helm/sundae/README.md).

on:
  push:
    branches:
      - "main"
      - "develop"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sundae
            file: Containerfile
            context: .
          - name: sundae-sandbox
            file: deploy/sandbox/Containerfile
            context: deploy/sandbox
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ steps.version.outputs.sha }}
            COMMIT_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  chart:
    # Publish helm/sundae as an OCI chart once both images are pushed.
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Version
        id: version
        run: |
          base="$(yq '.version' helm/sundae/Chart.yaml)"
          short="$(git rev-parse --short=7 HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${base}-${GITHUB_REF_NAME//[^a-zA-Z0-9]/-}.${short}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "app=sha-$short" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.version }}
          APP: ${{ steps.version.outputs.app }}
        run: |
          # The source chart has no default image; the published one points at
          # the images this run pushed (image.tag defaults to appVersion).
          owner="${OWNER,,}"
          yq -i ".image.repository = \"ghcr.io/${owner}/sundae\"" helm/sundae/values.yaml
          # Fetch the dependencies Chart.lock pins (the OpenShell chart from
          # ghcr.io/nvidia, the vendored helm/vendor/agent-sandbox) into
          # helm/sundae/charts/, so the package embeds both.
          helm dependency build helm/sundae
          helm lint helm/sundae
          helm lint helm/sundae --set openshell.install=true --set agentSandbox.install=true --set config.openshell.image=example.com/sandbox:latest
          helm package helm/sundae --version "$VERSION" --app-version "$APP" -d dist

      - name: Push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/sundae-*.tgz "oci://ghcr.io/${OWNER,,}/charts"
